name: Envio Diario de Empleos

on:
  schedule:
    # 11:00 UTC equivale a las 08:00 AM en Argentina (UTC-3)
    - cron: '0 11 * * *'
  workflow_dispatch: # Habilita un botón para probarlo manualmente cuando quieras

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar gestor uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Ejecutar script multi-perfil
        env:
          PYTHONUNBUFFERED: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GROQ_DRY_RUN: ${{ vars.GROQ_DRY_RUN }} 
        run: >
          uv run --no-project --python 3.12
          --with beautifulsoup4 --with groq --with python-jobspy
          --with openpyxl --with requests --with pandas --with json-repair
          batch_runner.py