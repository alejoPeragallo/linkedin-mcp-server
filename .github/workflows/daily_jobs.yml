name: Envio Diario de Empleos

on:
  schedule:
    # 11:00 UTC equivale a las 08:00 AM en Argentina (UTC-3)
    - cron: '0 11 * * *'
  workflow_dispatch: # Habilita un botón para probarlo manualmente cuando quieras

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar gestor uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Ejecutar script multi-perfil
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        # --no-project evita tocar el pyproject.toml del repo (es de otro
        # proyecto, linkedin-mcp-server, y no queremos construirlo ni
        # sincronizarlo). --with arma un entorno aislado y efimero con
        # exactamente lo que batch_runner.py necesita, incluido pandas
        # (que faltaba en el pyproject.toml existente).
        run: >
          uv run --no-project --python 3.12
          --with beautifulsoup4 --with google-genai --with python-jobspy
          --with openpyxl --with requests --with pandas
          batch_runner.py